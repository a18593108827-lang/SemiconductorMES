name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn test
        working-directory: server
        run: mvn -B test

  docs:
    name: 文档总账与文档同步（frontmatter / 状态列）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: reindex 后 INDEX 必须无差异
        run: |
          python .workbuddy/scripts/add_frontmatter.py --reindex
          git diff --exit-code -- docs/INDEX.md

  web:
    name: 前端类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: tsc -b
        working-directory: web
        run: npx tsc -b
