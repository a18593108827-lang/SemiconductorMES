<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谱系建树流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 960px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Lot Genealogy</p>
    <h1>谱系建树流程</h1>

    <svg viewBox="0 0 800 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lot-genealogy-build-title lot-genealogy-build-desc">
      <title id="lot-genealogy-build-title">谱系建树流程</title>
      <desc id="lot-genealogy-build-desc">锚点 Lot 按 direction 先 fillDown 再 buildUp 得到谱系树；depth 触顶仍有边则 truncated；客诉再展平为影响面。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== connectors (behind) ===== -->
      <line x1="320" y1="52" x2="320" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="128" x2="320" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- D1 YES down to fillDown -->
      <line x1="320" y1="220" x2="320" y2="244" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="292" y="224" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="233" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- D1 NO elbow to merge M1 -->
      <path d="M 376 184 H 520 Q 528 184 528 192 V 316 Q 528 324 520 324 H 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="432" y="164" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="452" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- fillDown → M1 -->
      <line x1="320" y1="308" x2="320" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M1 → D2 -->
      <line x1="320" y1="328" x2="320" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- D2 YES → buildUp -->
      <line x1="320" y1="424" x2="320" y2="448" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="292" y="428" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="437" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- D2 NO elbow to M2 -->
      <path d="M 376 388 H 520 Q 528 388 528 396 V 520 Q 528 528 520 528 H 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="432" y="368" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="452" y="377" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- buildUp → M2 -->
      <line x1="320" y1="512" x2="320" y2="524" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M2 → return tree -->
      <line x1="320" y1="532" x2="320" y2="556" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- return → flatten (dashed optional) -->
      <line x1="320" y1="612" x2="320" y2="636" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <rect x="336" y="616" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="372" y="625" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMPLAINT</text>

      <!-- ===== nodes ===== -->
      <!-- start -->
      <rect x="248" y="20" width="144" height="32" rx="16" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">开始 · 锚点 Lot</text>

      <!-- build node -->
      <rect x="232" y="72" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="72" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">建锚点节点</text>
      <text x="320" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">depth 默认 5 · ≤20</text>

      <!-- diamond 1: 含 down -->
      <polygon points="320,148 384,184 320,220 256,184" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">含 down?</text>
      <text x="320" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">down / both</text>

      <!-- fillDown -->
      <rect x="220" y="244" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="244" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="320" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fillDown</text>
      <text x="320" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">parent=我 · 全边 ASC</text>
      <text x="320" y="296" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">触顶有边 → truncated</text>

      <!-- merge M1 -->
      <circle cx="320" cy="324" r="4" fill="#2d3142"/>

      <!-- diamond 2 -->
      <polygon points="320,352 384,388 320,424 256,388" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">含 up?</text>
      <text x="320" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">up / both</text>

      <!-- buildUp -->
      <rect x="220" y="448" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="448" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="320" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">buildUp</text>
      <text x="320" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">child=我 · 最新边</text>
      <text x="320" y="500" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">visited 防环</text>

      <!-- merge M2 -->
      <circle cx="320" cy="528" r="4" fill="#2d3142"/>

      <!-- return tree -->
      <rect x="232" y="556" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="556" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">返回树根</text>
      <text x="320" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">both 时根=最顶祖先</text>

      <!-- flatten -->
      <rect x="220" y="636" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="636" width="200" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="320" y="656" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">flattenImpact</text>
      <text x="320" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ANCHOR / ANCESTOR / DESC</text>

      <!-- legend -->
      <line x1="40" y1="704" x2="760" y2="704" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="724" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="716" width="48" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">起止</text>
      <rect x="220" y="716" width="40" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="272" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">步骤</text>
      <polygon points="332,724 344,716 356,724 344,732" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="368" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">判断</text>
      <rect x="420" y="716" width="40" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="472" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">核心展开</text>
      <rect x="540" y="716" width="40" height="16" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="592" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">客诉展平</text>
    </svg>
  </div>
</body>
</html>
