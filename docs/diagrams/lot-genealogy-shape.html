<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谱系树形态 · both</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 960px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .sub {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 640px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · Lot Genealogy</p>
    <h1>谱系树形态 · both</h1>
    <p class="sub">边在 mes_lot_genealogy；Track Split/Merge 写入。边字段挂在 child 端。</p>

    <svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lot-genealogy-shape-title lot-genealogy-shape-desc">
      <title id="lot-genealogy-shape-title">谱系树形态 both</title>
      <desc id="lot-genealogy-shape-desc">direction=both 时返回以最顶祖先为根、锚点居中、子孙向下的树；展平后分别为 ANCESTOR、ANCHOR、DESCENDANT。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- orthogonal tree connectors -->
      <!-- ancestor → parent -->
      <path d="M 360 76 V 96" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- parent → anchor -->
      <path d="M 360 148 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- anchor bus to children -->
      <path d="M 360 232 V 252 H 200 Q 192 252 192 260 V 272" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 360 252 H 520 Q 528 252 528 260 V 272" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

      <!-- edge labels on child side -->
      <rect x="368" y="100" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="396" y="109" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPLIT</text>
      <rect x="368" y="172" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="396" y="181" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPLIT</text>
      <rect x="200" y="256" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="228" y="265" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPLIT</text>
      <rect x="456" y="256" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="265" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MERGE*</text>

      <!-- Ancestor -->
      <rect x="288" y="32" width="144" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="32" width="144" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">祖先 Lot</text>
      <text x="360" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ANCESTOR · 树根</text>

      <!-- Parent -->
      <rect x="288" y="104" width="144" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="104" width="144" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">父批</text>
      <text x="360" y="140" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ANCESTOR</text>

      <!-- Anchor focal -->
      <rect x="280" y="176" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="176" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="360" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">锚点 Lot</text>
      <text x="360" y="216" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ANCHOR · 查询入口</text>

      <!-- Child A -->
      <rect x="120" y="280" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="280" width="144" height="48" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="192" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">子批 A</text>
      <text x="192" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DESCENDANT</text>

      <!-- Child B / merge source shown as descendant of main -->
      <rect x="456" y="280" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="280" width="144" height="48" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="528" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">子批 B</text>
      <text x="528" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DESCENDANT</text>

      <!-- note box -->
      <rect x="80" y="360" width="560" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="100" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">边语义（表）</text>
      <text x="100" y="404" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">split：parent=父 · child=子 · qty=拆走量</text>
      <text x="100" y="424" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">merge：parent=主批 · child=被吞源 · 上溯取最新边</text>

      <!-- legend -->
      <line x1="40" y1="464" x2="680" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="476" width="40" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="172" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">锚点</text>
      <rect x="220" y="476" width="40" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="272" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">祖先</text>
      <rect x="320" y="476" width="40" height="16" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="372" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">子孙</text>
      <text x="440" y="488" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">* MERGE 边挂在被吞源 child 端</text>
    </svg>
  </div>
</body>
</html>
