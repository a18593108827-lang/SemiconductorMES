<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批次执行</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Track</p>
    <h1>批次执行</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lot-track-exec-title lot-track-exec-desc">
      <title id="lot-track-exec-title">批次执行</title>
      <desc id="lot-track-exec-desc">批次从放行进入当前站，经锁批闸后 TrackIn 加工，完工 TrackOut；末站完成，否则回下一站 Wait；中止则回同站 Wait。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows -->
      <line x1="280" y1="88" x2="280" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="156" x2="280" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="248" x2="280" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="212" x2="440" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="316" x2="280" y2="336" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="280" y1="384" x2="280" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="440" x2="408" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="568" y1="440" x2="616" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 200,440 H 88 Q 80,440 80,432 V 140 Q 80,132 88,132 H 200"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 488,476 V 504 Q 488,512 496,512 H 792 Q 800,512 800,504 V 140 Q 800,132 792,132 H 360"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <rect x="292" y="252" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="384" y="192" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="201" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="92" y="280" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="116" y="289" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ABORT</text>

      <rect x="356" y="420" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="384" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRACKOUT</text>

      <rect x="576" y="420" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="628" y="492" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="646" y="501" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT</text>

      <!-- Nodes -->
      <rect x="200" y="40" width="160" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="200" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="280" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">放行</text>
      <text x="280" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Release</text>

      <rect x="200" y="108" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="108" width="160" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="280" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">当前站</text>
      <text x="280" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wait</text>

      <polygon points="280,176 360,212 280,248 200,212" fill="#f5f5f5"/>
      <polygon points="280,176 360,212 280,248 200,212" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">已锁批?</text>

      <rect x="440" y="188" width="160" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="440" y="188" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="520" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">锁批</text>
      <text x="520" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">held</text>

      <rect x="200" y="268" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="268" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">开工</text>
      <text x="280" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TrackIn</text>

      <rect x="200" y="336" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="336" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="280" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">加工中</text>
      <text x="280" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">processing</text>

      <polygon points="280,404 360,440 280,476 200,440" fill="#f5f5f5"/>
      <polygon points="280,404 360,440 280,476 200,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">完工?</text>

      <polygon points="488,404 568,440 488,476 408,440" fill="#f5f5f5"/>
      <polygon points="488,404 568,440 488,476 408,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="488" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">末站?</text>

      <rect x="616" y="416" width="160" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="616" y="416" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="696" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">完成</text>
      <text x="696" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">completed</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="582" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">起止</text>

      <rect x="140" y="572" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="172" y="582" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">步骤</text>

      <polygon points="252,578 264,572 276,578 264,584" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="288" y="582" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">判定</text>

      <rect x="348" y="572" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="380" y="582" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">加工</text>

      <line x1="448" y1="578" x2="480" y2="578" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="488" y="582" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">回站</text>
    </svg>
  </div>
</body>
</html>
