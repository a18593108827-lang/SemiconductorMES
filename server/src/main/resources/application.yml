server:
  port: 8080

spring:
  application:
    name: mes-server
  profiles:
    active: dev

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 鉴权配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# MES 业务配置
mes:
  dispatch:
    # 设备预约超时（分钟），默认 30
    reserve-ttl-minutes: 30
    # false=跳过 CRITICAL 未关闭禁派；Hold 闸仍生效
    block-critical-alarm-enabled: true
  recipe:
    # true=TrackIn 强制要求配方绑定解析成功；默认 false
    require-binding: false
  step:
    # off=不校验 | soft=有类型才校验 | force=加工站必须有类型且强制匹配
    eqp-type-mode: soft
  qtime:
    enabled: true
    default-on-violate: HOLD
    alarm-only-block: true
    fail-open: true
    scan-ms: 30000
  # 站内加工时长：开工计时，太短不让出站，太长出站后锁批
  process-time:
    enabled: true
    # 超时除了锁批，要不要再推告警（末站锁不了批时一定会告警）
    alarm-on-max-exceed: true
  edc:
    # false=应急关闸，required 站也放行；不删 Plan
    gate-enabled: true
    # OOS 采集后自动锁批；缺必采不挂
    auto-hold-on-oos: true
  spc:
    # false=关掉判异；图还在，采集不受影响
    enabled: true
  alarm:
    # false=raise 空操作；查询仍可读历史
    enabled: true
    # false=忽略码表 HOLD_LOT（风暴止血）；与 enabled 正交
    hold-on-raise-enabled: true
  carrier:
    # false=Facade 写路径拒（应急）
    enabled: true
    # true=TrackIn 强制已绑载具；默认 false 不挡存量线
    track-in-required: true
    # true=TrackIn 强制扫码比对 carrier_code；默认 false 不挡存量线
    track-in-scan-required: true
  complaint-package: # 客诉_追溯包
    # false=业务拒 COMPLAINT_PACKAGE_DISABLED；默认关不挡现网（dev 已开启联调）
    enabled: true
    max-members: 200 # 客诉最大成员数
    history-per-lot: 100 # 每批历史记录数
